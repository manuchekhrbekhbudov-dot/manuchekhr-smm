<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MANUCHEKHR — Admin Panel</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, #24103d 0%, transparent 35%),
        radial-gradient(circle at 90% 20%, #180d2b 0%, transparent 35%),
        #07060b;
      color: #fff;
      min-height: 100vh;
    }

    .container {
      width: min(1200px, 92%);
      margin: auto;
      padding: 40px 0 80px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .logo span {
      color: #a855f7;
    }

    .subtitle {
      color: #77717f;
      margin-top: 8px;
      letter-spacing: 3px;
      font-size: 12px;
    }

    .refresh {
      border: 1px solid #3b2948;
      background: #110d17;
      color: #fff;
      padding: 13px 20px;
      border-radius: 14px;
      cursor: pointer;
      transition: .3s;
    }

    .refresh:hover {
      border-color: #a855f7;
      box-shadow: 0 0 25px rgba(168, 85, 247, .18);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 25px;
    }

    .stat {
      background: rgba(16, 12, 22, .85);
      border: 1px solid #28212f;
      border-radius: 24px;
      padding: 28px;
    }

    .stat-title {
      color: #817887;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .stat-number {
      font-size: 48px;
      font-weight: 800;
      margin-top: 12px;
    }

    .purple {
      color: #b86cff;
    }

    .panel {
      background: rgba(12, 10, 15, .9);
      border: 1px solid #28212f;
      border-radius: 28px;
      padding: 30px;
    }

    .panel-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .panel h1 {
      font-size: 32px;
    }

    .loading {
      color: #8b8291;
      padding: 30px 0;
    }

    .empty {
      padding: 50px 20px;
      text-align: center;
      color: #77717f;
    }

    .request {
      border: 1px solid #292230;
      background: #0d0a11;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 16px;
      transition: .3s;
    }

    .request:hover {
      border-color: #63318a;
      transform: translateY(-2px);
    }

    .request-head {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .name {
      font-size: 22px;
      font-weight: 700;
    }

    .date {
      color: #746b7c;
      font-size: 12px;
      margin-top: 6px;
    }

    .status {
      height: fit-content;
      padding: 7px 12px;
      border-radius: 30px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status.new {
      color: #c084fc;
      background: rgba(168, 85, 247, .12);
      border: 1px solid rgba(168, 85, 247, .25);
    }

    .status.read {
      color: #60a5fa;
      background: rgba(59, 130, 246, .1);
      border: 1px solid rgba(59, 130, 246, .2);
    }

    .status.done {
      color: #4ade80;
      background: rgba(34, 197, 94, .1);
      border: 1px solid rgba(34, 197, 94, .2);
    }

    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .info-box {
      background: #09070c;
      border: 1px solid #211b27;
      border-radius: 14px;
      padding: 15px;
    }

    .label {
      color: #696170;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 7px;
    }

    .value {
      color: #eee;
      word-break: break-word;
    }

    .message {
      background: #09070c;
      border: 1px solid #211b27;
      border-radius: 14px;
      padding: 18px;
      color: #d7d1dc;
      line-height: 1.6;
      margin-bottom: 18px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .actions button {
      border: 1px solid #33283d;
      background: #120d17;
      color: #ddd;
      padding: 10px 15px;
      border-radius: 11px;
      cursor: pointer;
      transition: .25s;
    }

    .actions button:hover {
      border-color: #a855f7;
      color: #fff;
    }

    .actions .delete:hover {
      border-color: #ef4444;
      color: #f87171;
    }

    .error {
      color: #f87171;
      background: rgba(239, 68, 68, .08);
      border: 1px solid rgba(239, 68, 68, .2);
      padding: 18px;
      border-radius: 15px;
      line-height: 1.5;
    }

    @media (max-width: 700px) {
      .container {
        width: 94%;
        padding-top: 25px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 18px;
        border-radius: 20px;
      }

      .panel h1 {
        font-size: 25px;
      }

      .info {
        grid-template-columns: 1fr;
      }

      .request-head {
        flex-direction: column;
      }

      .stat-number {
        font-size: 40px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <div>
        <div class="logo">
          MANUCHEKHR<span>.</span>
        </div>

        <div class="subtitle">
          ADMIN DASHBOARD
        </div>
      </div>

      <button class="refresh" id="refreshBtn">
        ↻ Навсозӣ
      </button>
    </header>


    <section class="stats">

      <div class="stat">
        <div class="stat-title">
          Ҳамаи дархостҳо
        </div>

        <div class="stat-number" id="totalCount">
          0
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          Хонда нашуда
        </div>

        <div class="stat-number purple" id="newCount">
          0
        </div>
      </div>


      <div class="stat">
        <div class="stat-title">
          Лоиҳаҳо
        </div>

        <div class="stat-number" id="doneCount">
          0
        </div>
      </div>

    </section>


    <section class="panel">

      <div class="panel-top">
        <h1>Паёмҳои клиентҳо</h1>
      </div>

      <div id="requests">
        <div class="loading">
          Дархостҳо бор шуда истодаанд...
        </div>
      </div>

    </section>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      query,
      orderBy,
      onSnapshot,
      updateDoc,
      deleteDoc,
      doc
    } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


    /* ================================
       FIREBASE CONFIG
    ================================= */

    const firebaseConfig = {

      apiKey: "AIzaSyAteF9GeUK8RyKohaiBy_K7dsLix4Z0Sho",

      authDomain:
        "manuchekhr-smm.firebaseapp.com",

      projectId:
        "manuchekhr-smm",

      storageBucket:
        "manuchekhr-smm.firebasestorage.app",

      messagingSenderId:
        "226231175635",

      appId:
        "1:226231175635:web:3ef2c939fe16bb7ab44726",

      measurementId:
        "G-39DX3S5VS4"
    };


    /* ================================
       FIREBASE
    ================================= */

    const app =
      initializeApp(firebaseConfig);

    const db =
      getFirestore(app);


    /* ================================
       ELEMENTS
    ================================= */

    const requests =
      document.getElementById("requests");

    const totalCount =
      document.getElementById("totalCount");

    const newCount =
      document.getElementById("newCount");

    const doneCount =
      document.getElementById("doneCount");

    const refreshBtn =
      document.getElementById("refreshBtn");


    let unsubscribe = null;


    /* ================================
       FORMAT DATE
    ================================= */

    function formatDate(timestamp) {

      if (!timestamp) {
        return "Сана маълум нест";
      }

      try {

        const date =
          timestamp.toDate();

        return date.toLocaleString(
          "tg-TJ",
          {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          }
        );

      } catch {

        return "Сана маълум нест";
      }
    }


    /* ================================
       ESCAPE HTML
    ================================= */

    function escapeHTML(value) {

      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    /* ================================
       STATUS
    ================================= */

    function statusText(status) {

      if (status === "read") {
        return "Хонда шуд";
      }

      if (status === "done") {
        return "Анҷом ёфт";
      }

      return "Нав";
    }


    /* ================================
       LOAD REQUESTS
    ================================= */

    function loadRequests() {

      if (unsubscribe) {
        unsubscribe();
      }

      requests.innerHTML =
        '<div class="loading">Дархостҳо бор шуда истодаанд...</div>';


      const q = query(
        collection(db, "complaints"),
        orderBy("createdAt", "desc")
      );


      unsubscribe = onSnapshot(
        q,

        snapshot => {

          totalCount.textContent =
            snapshot.size;


          let newTotal = 0;
          let doneTotal = 0;


          if (snapshot.empty) {

            newCount.textContent = "0";
            doneCount.textContent = "0";

            requests.innerHTML = `
              <div class="empty">
                Ҳоло ягон паёми клиент нест.
              </div>
            `;

            return;
          }


          let html = "";


          snapshot.forEach(item => {

            const data = item.data();

            const id = item.id;

            const status =
              data.status || "new";


            if (status === "new") {
              newTotal++;
            }

            if (status === "done") {
              doneTotal++;
            }


            html += `

              <article class="request">

                <div class="request-head">

                  <div>

                    <div class="name">
                      ${escapeHTML(data.name)}
                    </div>

                    <div class="date">
                      ${formatDate(data.createdAt)}
                    </div>

                  </div>


                  <div class="status ${escapeHTML(status)}">
                    ${statusText(status)}
                  </div>

                </div>


                <div class="info">

                  <div class="info-box">

                    <div class="label">
                      Телефон
                    </div>

                    <div class="value">
                      ${escapeHTML(data.phone)}
                    </div>

                  </div>


                  <div class="info-box">

                    <div class="label">
                      Манбаъ
                    </div>

                    <div class="value">
                      ${escapeHTML(data.source || "Website")}
                    </div>

                  </div>

                </div>


                <div class="message">

                  ${escapeHTML(data.message)}

                </div>


                <div class="actions">

                  <button
                    onclick="markRead('${id}')">
                    ✓ Хонда шуд
                  </button>


                  <button
                    onclick="markDone('${id}')">
                    ✓ Анҷом ёфт
                  </button>


                  <button
                    onclick="callClient('${encodeURIComponent(data.phone || "")}')">
                    ☎ Тамос
                  </button>


                  <button
                    class="delete"
                    onclick="deleteRequest('${id}')">
                    🗑 Нест кардан
                  </button>

                </div>

              </article>
            `;
          });


          newCount.textContent =
            newTotal;

          doneCount.textContent =
            doneTotal;


          requests.innerHTML =
            html;

        },

        error => {

          console.error(error);

          requests.innerHTML = `

            <div class="error">

              ❌ Хатои Firebase.

              <br><br>

              Эҳтимол Firestore Rules иҷозаи
              хондани маълумотро намедиҳад.

              <br><br>

              ${escapeHTML(error.message)}

            </div>
          `;
        }
      );
    }


    /* ================================
       MARK READ
    ================================= */

    window.markRead = async function(id) {

      try {

        await updateDoc(
          doc(db, "complaints", id),
          {
            status: "read"
          }
        );

      } catch(error) {

        console.error(error);

        alert(
          "Статусро тағйир додан нашуд."
        );
      }
    };


    /* ================================
       MARK DONE
    ================================= */

    window.markDone = async function(id) {

      try {

        await updateDoc(
          doc(db, "complaints", id),
          {
            status: "done"
          }
        );

      } catch(error) {

        console.error(error);

        alert(
          "Статусро тағйир додан нашуд."
        );
      }
    };


    /* ================================
       DELETE
    ================================= */

    window.deleteRequest = async function(id) {

      const ok =
        confirm(
          "Ин дархостро нест кардан мехоҳед?"
        );


      if (!ok) {
        return;
      }


      try {

        await deleteDoc(
          doc(db, "complaints", id)
        );

      } catch(error) {

        console.error(error);

        alert(
          "Дархостро нест кардан нашуд."
        );
      }
    };


    /* ================================
       CALL CLIENT
    ================================= */

    window.callClient = function(phone) {

      const number =
        decodeURIComponent(phone);

      if (!number) {
        return;
      }

      window.location.href =
        "tel:" + number;
    };


    /* ================================
       REFRESH
    ================================= */

    refreshBtn.addEventListener(
      "click",
      loadRequests
    );


    /* ================================
       START
    ================================= */

    loadRequests();

  </script>

</body>
</html>
