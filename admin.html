<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MANUCHEKHR — Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #241035 0%, #09070d 45%);
      color: white;
      min-height: 100vh;
      padding: 30px 16px;
    }

    .admin-container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .logo span {
      color: #b45cff;
    }

    .top a,
    button {
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
    }

    .top a:hover,
    button:hover {
      border-color: #a855f7;
      background: rgba(168,85,247,.15);
    }

    .title {
      margin-bottom: 25px;
    }

    .title small {
      color: #b45cff;
      letter-spacing: 2px;
    }

    .title h1 {
      font-size: clamp(38px, 7vw, 70px);
      margin-top: 8px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      padding: 25px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 22px;
      background: rgba(255,255,255,.035);
    }

    .stat span {
      color: #999;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .stat strong {
      display: block;
      font-size: 42px;
      margin-top: 10px;
    }

    .panel {
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 25px;
      background: rgba(255,255,255,.035);
      padding: 25px;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .panel-head h2 {
      font-size: 25px;
    }

    #messages {
      display: grid;
      gap: 15px;
    }

    .message {
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 20px;
      padding: 22px;
      background: rgba(0,0,0,.2);
    }

    .message-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
      margin-bottom: 15px;
    }

    .client-name {
      font-size: 20px;
      font-weight: 700;
    }

    .date {
      color: #777;
      font-size: 12px;
      margin-top: 5px;
    }

    .status {
      border-radius: 30px;
      padding: 7px 12px;
      font-size: 11px;
      background: #22152c;
      color: #c084fc;
    }

    .message-info {
      display: grid;
      gap: 8px;
      margin-bottom: 15px;
      color: #aaa;
    }

    .message-info b {
      color: white;
    }

    .message-text {
      border-top: 1px solid rgba(255,255,255,.08);
      padding-top: 15px;
      color: #ccc;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .message-actions {
      margin-top: 18px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .message-actions button {
      font-size: 12px;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #777;
    }

    .error {
      color: #ff7070;
      padding: 15px;
      border-radius: 12px;
      background: rgba(255,0,0,.07);
      margin-bottom: 15px;
    }

    .login {
      max-width: 450px;
      margin: 80px auto;
      padding: 30px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 25px;
      background: rgba(255,255,255,.035);
    }

    .login h2 {
      font-size: 35px;
      margin-bottom: 25px;
    }

    .login label {
      display: block;
      margin-bottom: 15px;
      color: #aaa;
      font-size: 14px;
    }

    .login input {
      display: block;
      width: 100%;
      margin-top: 7px;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1);
      background: #0d0a12;
      color: white;
      outline: none;
    }

    .login input:focus {
      border-color: #a855f7;
    }

    .login button {
      width: 100%;
      background: linear-gradient(135deg,#8b3dff,#c154e8);
      border: 0;
      margin-top: 10px;
    }

    #loginError {
      color: #ff7070;
      margin-top: 15px;
      font-size: 13px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 700px) {

      body {
        padding: 20px 12px;
      }

      .top {
        align-items: flex-start;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 16px;
      }

      .message {
        padding: 17px;
      }

      .message-top {
        flex-direction: column;
      }

      .panel-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .panel-head button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="admin-container">

    <!-- LOGIN -->
    <div id="loginBox" class="login">

      <div class="logo">
        MANUCHEKHR<span>.</span>
      </div>

      <h2>Admin Panel</h2>

      <form id="loginForm">

        <label>
          Email
          <input
            id="email"
            type="email"
            placeholder="admin@email.com"
            required
          >
        </label>

        <label>
          Password
          <input
            id="password"
            type="password"
            placeholder="********"
            required
          >
        </label>

        <button type="submit">
          Ворид шудан
        </button>

        <div id="loginError"></div>

      </form>

    </div>


    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden">

      <div class="top">

        <div class="logo">
          MANUCHEKHR<span>.</span>
        </div>

        <div>
          <a href="index.html">
            Сайт
          </a>

          <button id="logout">
            Баромадан
          </button>
        </div>

      </div>


      <div class="title">

        <small>PRIVATE DASHBOARD</small>

        <h1>Admin Panel</h1>

      </div>


      <!-- STATS -->
      <div class="stats">

        <div class="stat">
          <span>ҲАМАИ ПАЁМҲО</span>
          <strong id="total">0</strong>
        </div>

        <div class="stat">
          <span>ХОНДА НАШУДА</span>
          <strong id="newMessages">0</strong>
        </div>

        <div class="stat">
          <span>АНҶОМШУДА</span>
          <strong id="doneMessages">0</strong>
        </div>

      </div>


      <!-- MESSAGES -->
      <div class="panel">

        <div class="panel-head">

          <h2>
            Паёмҳои клиентҳо
          </h2>

          <button id="refresh">
            ↻ Навсозӣ
          </button>

        </div>

        <div id="messages">

          <div class="empty">
            Loading...
          </div>

        </div>

      </div>

    </div>

  </div>


  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


  <script>

    const firebaseConfig = {

      apiKey: "AIzaSyAteF9GeUK8RyKohaiBy_K7dsLix4Z0Sho",

      authDomain:
        "manuchekhr-smm.firebaseapp.com",

      projectId:
        "manuchekhr-smm",

      storageBucket:
        "manuchekhr-smm.firebasestorage.app",

      messagingSenderId:
        "226231175635",

      appId:
        "1:226231175635:web:3ef2c939fe16bb7ab44726",

      measurementId:
        "G-39DX3S5VS4"

    };


    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();

    const db = firebase.firestore();


    const loginBox =
      document.getElementById("loginBox");

    const dashboard =
      document.getElementById("dashboard");

    const loginForm =
      document.getElementById("loginForm");

    const loginError =
      document.getElementById("loginError");

    const messages =
      document.getElementById("messages");


    /*
      LOGIN
    */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        loginError.textContent = "";

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;


        try {

          await auth.signInWithEmailAndPassword(
            email,
            password
          );

        } catch(error) {

          console.error(error);

          loginError.textContent =
            "Email ё password нодуруст аст.";

        }

      }
    );


    /*
      AUTH STATE
    */

    auth.onAuthStateChanged(function(user) {

      if(user) {

        loginBox.classList.add("hidden");

        dashboard.classList.remove("hidden");

        loadMessages();

      } else {

        loginBox.classList.remove("hidden");

        dashboard.classList.add("hidden");

      }

    });


    /*
      LOGOUT
    */

    document
      .getElementById("logout")
      .addEventListener("click", function() {

        auth.signOut();

      });


    /*
      REFRESH
    */

    document
      .getElementById("refresh")
      .addEventListener("click", function() {

        loadMessages();

      });


    /*
      LOAD CLIENT MESSAGES
    */

    async function loadMessages() {

      messages.innerHTML =
        '<div class="empty">Loading...</div>';


      try {

        const snapshot =
          await db
            .collection("complaints")
            .orderBy("createdAt", "desc")
            .get();


        let total = 0;

        let newCount = 0;

        let doneCount = 0;


        messages.innerHTML = "";


        if(snapshot.empty) {

          messages.innerHTML = `
            <div class="empty">
              Ҳоло ягон паёми клиент нест.
            </div>
          `;

        }


        snapshot.forEach(function(doc) {

          const data = doc.data();

          total++;


          if(data.status === "new") {
            newCount++;
          }


          if(data.status === "done") {
            doneCount++;
          }


          const card =
            document.createElement("div");

          card.className = "message";


          const date =
            data.createdAt &&
            data.createdAt.toDate
              ? data.createdAt.toDate()
                  .toLocaleString("tg-TJ")
              : "—";


          card.innerHTML = `

            <div class="message-top">

              <div>

                <div class="client-name">
                  ${escapeHTML(data.name || "Без ном")}
                </div>

                <div class="date">
                  ${date}
                </div>

              </div>

              <div class="status">
                ${escapeHTML(data.status || "new")}
              </div>

            </div>


            <div class="message-info">

              <div>
                📞 <b>Телефон:</b>
                ${escapeHTML(data.phone || "—")}
              </div>

              <div>
                🏢 <b>Бизнес:</b>
                ${escapeHTML(data.business || "—")}
              </div>

              <div>
                💼 <b>Хизмат:</b>
                ${escapeHTML(data.service || "—")}
              </div>

            </div>


            <div class="message-text">
              ${escapeHTML(data.message || "Паём нест")}
            </div>


            <div class="message-actions">

              <button
                onclick="changeStatus('${doc.id}', 'new')">
                🆕 New
              </button>

              <button
                onclick="changeStatus('${doc.id}', 'read')">
                👁 Read
              </button>

              <button
                onclick="changeStatus('${doc.id}', 'done')">
                ✅ Done
              </button>

            </div>

          `;


          messages.appendChild(card);

        });


        document.getElementById("total").textContent =
          total;

        document.getElementById("newMessages").textContent =
          newCount;

        document.getElementById("doneMessages").textContent =
          doneCount;


      } catch(error) {

        console.error(error);

        messages.innerHTML = `

          <div class="error">

            Firebase error.

            <br><br>

            Firestore Rules ё Index-ро санҷед.

          </div>

        `;

      }

    }


    /*
      CHANGE STATUS
    */

    async function changeStatus(id, status) {

      try {

        await db
          .collection("complaints")
          .doc(id)
          .update({
            status: status
          });


        loadMessages();


      } catch(error) {

        console.error(error);

        alert(
          "Status тағйир дода нашуд."
        );

      }

    }


    /*
      SECURITY:
      HTML-ро аз паёми клиент тоза мекунем.
    */

    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

  </script>

</body>
</html>
